name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: venue_wrangler
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-admin-change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d venue_wrangler"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql://venue_app:local-app-change-me@127.0.0.1:5432/venue_wrangler
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Provision isolated application and migration roles
        run: |
          set -euo pipefail
          postgres_container="$(docker ps --filter 'ancestor=postgres:17-alpine' --format '{{.ID}}' | head -n 1)"
          if [[ -z "${postgres_container}" ]]; then
            echo "The PostgreSQL service container is unavailable."
            exit 1
          fi
          docker exec -i "${postgres_container}" psql -v ON_ERROR_STOP=1 -U postgres -d venue_wrangler < prisma/init/001_roles.sql

      - name: Apply migrations as the non-superuser migrator
        env:
          DATABASE_URL: postgresql://venue_migrator:local-migrator-change-me@127.0.0.1:5432/venue_wrangler
        run: npx prisma migrate deploy

      - name: Seed two-tenant RLS fixtures as the migrator
        env:
          DATABASE_URL: postgresql://venue_migrator:local-migrator-change-me@127.0.0.1:5432/venue_wrangler
        run: npx prisma db execute --schema prisma/schema.prisma --file prisma/seed-development.sql

      - name: Check API dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build API
        run: npm run build

      - name: Run API tests
        run: npm test

      - name: Verify tenant isolation using the runtime database role
        run: npm run test:tenant-isolation

  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prototype/venue_wrangler_prototype
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
          cache-key: flutter-3.47.5

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test
